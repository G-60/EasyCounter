<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyCounter</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <label id="counter">0</label>
        <button type="button" class="inc" id="inc10">+10</button>
        <button type="button" class="inc" id="inc1">+1</button>
        <button type="button" class="reset" id="reset">Reset</button>
        <button type="button" class="dec" id="dec1">-1</button>
        <button type="button" class="dec" id="dec10">-10</button>
    </div>
    <footer>
    </footer>
    <script src="script.js"></script>
</body>
</html>
